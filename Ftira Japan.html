<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Ftira フティーラ · Japan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@200;300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="site-shared.css" />
  <link rel="stylesheet" href="dir-a.css" />

  <style>
    html, body { margin: 0; padding: 0; background: var(--ft-cream, #FAF8F4); }
    body {
      font-family: "Noto Serif JP", serif;
      color: #1A1410;
    }
    /* Full-bleed wrapper — fills viewport, internal scroll */
    .site-host {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    .site-host > .ftira-site {
      width: 100%;
      height: 100%;
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="site-data.jsx"></script>
  <script type="text/babel" src="site-components.jsx"></script>
  <script type="text/babel" src="dir-a.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "langPrimary": "ja",
      "accent": "terra",
      "density": "comfortable"
    }/*EDITMODE-END*/;

    function App() {
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

      return (
        <React.Fragment>
          <div className="site-host">
            <DirectionA tweaks={tweaks} />
          </div>

          <TweaksPanel title="Tweaks" subtitle="Editorial direction · A">
            <TweakSection title="Language priority" subtitle="Which voice leads the page">
              <TweakRadio
                value={tweaks.langPrimary}
                onChange={(v) => setTweak('langPrimary', v)}
                options={[
                  { value: 'ja', label: '日本語 First' },
                  { value: 'en', label: 'English first' },
                ]}
              />
            </TweakSection>

            <TweakSection title="Accent color" subtitle="Heritage Gold or Malta Terra">
              <TweakRadio
                value={tweaks.accent}
                onChange={(v) => setTweak('accent', v)}
                options={[
                  { value: 'terra', label: 'Malta Terra' },
                  { value: 'gold',  label: 'Heritage Gold' },
                ]}
              />
            </TweakSection>

            <TweakSection title="Density" subtitle="Vertical rhythm of sections">
              <TweakRadio
                value={tweaks.density}
                onChange={(v) => setTweak('density', v)}
                options={[
                  { value: 'comfortable', label: 'Comfortable' },
                  { value: 'tight', label: 'Tight' },
                ]}
              />
            </TweakSection>
          </TweaksPanel>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
